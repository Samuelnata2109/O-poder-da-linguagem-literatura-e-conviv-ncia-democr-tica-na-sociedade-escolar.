<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="arquivos.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
</head>
<body>
    <a href="index.html" class="btn-top-left">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Voltar</span>
    </a>

    <div class="container" style="margin-top: 60px;">
        <header style="text-align: center; margin-bottom: 30px; border-bottom: 2px solid #c8e6c9; padding-bottom: 20px;">
            <h1 style="color: var(--primary-dark, #1b5e20); margin: 0 0 10px 0; font-size: 1.8rem;">Meus Arquivos</h1>
            <p style="color: #666; margin: 0; font-size: 1.1rem;">Gerencie e visualize os arquivos que você importou.</p>
        </header>

        <!-- Lista onde os arquivos salvos serão injetados -->
        <div class="files-wrapper">
            <ul id="savedFilesList" class="file-list">
                <!-- Os itens aparecem aqui dinamicamente -->
            </ul>
        </div>
    </div>
    <!--MODAL FLUTUANTE-->
   <div id="modal-remover" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Excluir Arquivo</h3>
            <p>Você realmente quer apagar este arquivo?</p>
                <div class="modal-actions">
                    <button onclick="fecharModal()" class="btn-cancelar">Cancelar</button>
                    <button onclick="confirmarRemocao()" class="btn-confirmar">Sim, apagar</button>
                </div>
        </div>
    </div>

    <script src="arquivos.js"></script>
</body>
</html>
